            <input
              id="menu-search-mobile"

            <li class="relative flex items-center">

        <li>

    <main class="max-w-screen-xl mx-auto p-6">
      <div class="bg-white border border-slate-200 rounded-xl p-6">
        <h1 id="content-title" class="text-2xl font-bold text-slate-900">Loading...</h1>
        <div id="content-body" class="mt-2 text-slate-600">
          
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script>
      const API_BASE_URL = "https://api.adeptlogics.com";
      const PRODUCTS_ENDPOINT = "/public/products/categories";
      const PRODUCTS_LIST_ENDPOINT = "/public/products";
      const SERVICES_ENDPOINT = "/public/services/tree";
      const PAGES_ENDPOINT = "/public/pages";
      const BLOGS_ENDPOINT = "/public/blogs";
      const CONTACT_FORMS_ENDPOINT = "/public/contact-forms";
      const TENANT_DOMAIN = "kentuckytopprops.com";
      const TENANT_ID = "48b0c409-b37b-4719-9ebd-8678f774db64";

      const fallbackProducts = [
        {
          name: "Top Props",
          url: "/products/top-props",
          children: [
            { name: "Event Props", url: "/products/top-props/events" },
            { name: "Photo Props", url: "/products/top-props/photo" }
          ]
        },
        {
          name: "Accessories",
          url: "/products/accessories"
        }
      ];

      const fallbackServices = [
        {
          name: "Setup",
          url: "/services/setup",
          children: [
            { name: "On-site Setup", url: "/services/setup/onsite" },
            { name: "Virtual Setup", url: "/services/setup/virtual" }
          ]
        },
        {
          name: "Consulting",
          url: "/services/consulting"
        }
      ];

      function normalizeMenuItems(items) {
        if (!Array.isArray(items)) return [];
        return items.map((item) => {
          const childrenSource = Array.isArray(item.children)
            ? item.children
            : Array.isArray(item.subcategories)
              ? item.subcategories
              : [];
          const children = normalizeMenuItems(childrenSource);
          return {
            id: item.id,
            parentId: item.parentId || item.parent_id || null,
            slug: item.slug || null,
            name: item.name || item.title || "Untitled",
            description: item.description || item.content || "",
            content: item.content || "",
            url: item.url || item.link || item.slug || "#",
            children
          };
        });
      }

      function getTenantQueryParams() {
        const params = new URLSearchParams();
        if (TENANT_ID) {
          params.set("tenantId", TENANT_ID);
          return params;
        }

        const host = window.location.hostname.toLowerCase();
        const isLocalHost = host === "localhost" || host === "127.0.0.1";
        params.set("domain", isLocalHost ? TENANT_DOMAIN : host);
        return params;
      }

      async function fetchMenuData(endpoint, fallback) {
        try {
          const params = getTenantQueryParams();
          const response = await fetch(`${API_BASE_URL}${endpoint}?${params.toString()}`);
          if (!response.ok) throw new Error("API request failed");
          const payload = await response.json();
          const data = Array.isArray(payload) ? payload : payload.data;
          const normalized = normalizeMenuItems(data);
          return normalized.length ? normalized : fallback;
        } catch (error) {
          console.warn("Using fallback menu data for", endpoint, error);
          return fallback;
        }
      }

      async function fetchTenantScoped(endpoint) {
        const params = getTenantQueryParams();
        const response = await fetch(`${API_BASE_URL}${endpoint}?${params.toString()}`);
        if (!response.ok) throw new Error(`Request failed for ${endpoint}`);
        return response.json();
      }

      async function fetchPublicProductsList(options = {}) {
        const params = getTenantQueryParams();
        Object.entries(options).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== "") {
            params.set(key, String(value));
          }
        });
        const response = await fetch(`${API_BASE_URL}${PRODUCTS_LIST_ENDPOINT}?${params.toString()}`);
        if (!response.ok) {
          let body = "";
          try { body = await response.text(); } catch (_) {}
          const msg = body?.slice(0, 200) || response.statusText;
          throw new Error(`Products API ${response.status}: ${msg}`);
        }
        return response.json();
      }

      async function fetchProductBySlug(slug) {
        const params = getTenantQueryParams();
        const response = await fetch(`${API_BASE_URL}/public/products/by-slug/${encodeURIComponent(slug)}?${params.toString()}`);
        if (!response.ok) throw new Error(`Product not found: ${response.status}`);
        return response.json();
      }

      const PRODUCTS_PAGE_SIZE = 24;

      async function fetchProductsForCategory(category, offset = 0) {
        const slug = category?.slug || "";
        const id = category?.id || "";
        const limit = PRODUCTS_PAGE_SIZE;
        const attempts = [
          { categorySlug: slug, limit, offset },
          { categoryId: id, limit, offset }
        ];

        let lastError = null;
        for (const params of attempts) {
          if (!params.categorySlug && !params.categoryId) continue;
          try {
            const payload = await fetchPublicProductsList(params);
            const items = Array.isArray(payload?.items)
              ? payload.items
              : Array.isArray(payload)
                ? payload
                : [];
            const total = payload?.total ?? items.length;
            return { items, total, limit, offset };
          } catch (error) {
            lastError = error;
          }
        }

        // Fallback: fetch all products and filter client-side when we have categoryId
        if (id) {
          try {
            const payload = await fetchPublicProductsList({ limit: 100, offset: 0 });
            const all = Array.isArray(payload?.items) ? payload.items : Array.isArray(payload) ? payload : [];
            const items = all.filter((p) => p.categoryId === id || (p.category?.id === id) || (p.categoryLinks || []).some((l) => l.categoryId === id));
            return { items, total: items.length, limit: items.length, offset: 0 };
          } catch (e) {
            lastError = e;
          }
        }

        throw lastError || new Error("Unable to load products for category");
      }

      let pagesCache = null;
      let productsCatalogCache = [];
      let servicesCatalogCache = [];
      let cmsNavigationBound = false;
      let productsMenuRendered = false;
      let servicesMenuRendered = false;

      async function getPagesCache() {
        if (pagesCache) return pagesCache;
        const payload = await fetchTenantScoped(PAGES_ENDPOINT);
        pagesCache = Array.isArray(payload) ? payload : payload.data;
        return Array.isArray(pagesCache) ? pagesCache : [];
      }

      let submenuCounter = 0;

      function renderNestedMenu(items) {
        return items
          .map((item) => {
            if (item.children && item.children.length > 0) {
              submenuCounter += 1;
              const submenuId = `submenu-${submenuCounter}`;
              return `
                <li class="relative">
                  <button data-submenu-target="${submenuId}" class="submenu-toggle w-full flex items-center justify-between p-2 rounded hover:bg-slate-100">
                    <span>${item.name}</span>
                    <svg class="w-4 h-4" aria-hidden="true" fill="none" viewBox="0 0 24 24">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7" />
                    </svg>
                  </button>
                  <div id="${submenuId}" class="hidden md:absolute md:top-0 md:left-full md:ml-1 bg-white border border-slate-200 rounded-lg shadow-lg min-w-56 z-30 mt-1 md:mt-0">
                    <ul class="p-2">
                      ${renderNestedMenu(item.children)}
                    </ul>
                  </div>
                </li>
              `;
            }
            return `
              <li>
                <a href="${item.url}" class="block p-2 rounded hover:bg-slate-100">${item.name}</a>
              </li>
            `;
          })
          .join("");
      }

      function bindProductsLoadMore() {
        const btn = document.querySelector("[data-products-load-more]");
        if (!btn) return;
        btn.addEventListener("click", async function () {
          const slug = this.getAttribute("data-category-slug") || "";
          const id = this.getAttribute("data-category-id") || "";
          const nextOffset = parseInt(this.getAttribute("data-next-offset") || "0", 10);
          const total = parseInt(this.getAttribute("data-total") || "0", 10);
          const gridEl = document.getElementById("products-grid");
          const countEl = document.getElementById("products-count");
          const wrapEl = document.getElementById("products-load-more-wrap");
          if (!gridEl || !countEl) return;

          this.disabled = true;
          this.textContent = "Loading…";
          try {
            const { items } = await fetchProductsForCategory({ slug, id }, nextOffset);
            items.forEach((p) => {
              gridEl.insertAdjacentHTML("beforeend", renderProductCard(p));
            });
            const newCount = gridEl.querySelectorAll("article").length;
            countEl.textContent = `Showing ${newCount} of ${total} products`;
            this.setAttribute("data-next-offset", String(nextOffset + items.length));
            if (newCount >= total && wrapEl) wrapEl.remove();
            else {
              this.disabled = false;
              this.textContent = "Load more";
            }
          } catch {
            this.disabled = false;
            this.textContent = "Load more";
          }
        });
      }

      function bindSubmenuToggles() {
        document.querySelectorAll(".submenu-toggle").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const targetId = button.getAttribute("data-submenu-target");
            const targetEl = targetId ? document.getElementById(targetId) : null;
            if (targetEl) {
              targetEl.classList.toggle("hidden");
            }
          });
        });
      }

      function buildTreeFromParent(items) {
        const byId = new Map();
        const roots = [];

        items.forEach((item) => {
          byId.set(item.id, { ...item, children: [] });
        });

        byId.forEach((item) => {
          if (item.parentId && byId.has(item.parentId)) {
            byId.get(item.parentId).children.push(item);
          } else {
            roots.push(item);
          }
        });

        return roots;
      }

      function slugFromUrl(url) {
        if (!url || typeof url !== "string") return "";
        const path = url.replace(/^https?:\/\/[^/]+/, "").replace(/^\/+/, "");
        const segments = path.split("/").filter(Boolean);
        return (segments[segments.length - 1] || "").toLowerCase();
      }

      function adaptProductCategoriesToMenu(categories) {
        if (!Array.isArray(categories)) return [];
        const hasParentStructure = categories.some((item) => item && (item.id || item.parentId));
        const tree = hasParentStructure ? buildTreeFromParent(categories) : categories;
        const mapNode = (node) => {
          const slug = node.slug || slugFromUrl(node.url) || "";
          return {
            id: node.id || "",
            slug,
            name: node.name || "Untitled",
            description: node.description || "",
            content: node.content || "",
            url: slug ? `/products/${slug}` : "/products",
            children: (node.children || []).map(mapNode)
          };
        };
        return tree.map(mapNode);
      }

      function adaptServicesToMenu(services) {
        if (!Array.isArray(services)) return [];
        const maybeTree = services.some((s) => Array.isArray(s.children) && s.children.length > 0)
          ? services
          : services.some((s) => s && (s.id || s.parentId))
            ? buildTreeFromParent(services)
            : services;

        const mapNode = (node) => ({
          id: node.id || "",
          slug: node.slug || "",
          name: node.name || "Untitled",
          description: node.description || "",
          content: node.content || "",
          url: node.slug ? `/services/${node.slug}` : "/services",
          children: (node.children || []).map(mapNode)
        });
        return maybeTree.map(mapNode);
      }

      async function ensureProductsLoaded() {
        if (productsCatalogCache.length) return productsCatalogCache;
        const rawProducts = await fetchMenuData(PRODUCTS_ENDPOINT, fallbackProducts);
        productsCatalogCache = adaptProductCategoriesToMenu(rawProducts);
        return productsCatalogCache;
      }

      async function ensureServicesLoaded() {
        if (servicesCatalogCache.length) return servicesCatalogCache;
        const rawServices = await fetchMenuData(SERVICES_ENDPOINT, fallbackServices);
        servicesCatalogCache = adaptServicesToMenu(rawServices);
        return servicesCatalogCache;
      }

      async function renderProductsMenuIfNeeded() {
        if (productsMenuRendered) return;
        const products = await ensureProductsLoaded();
        const productsDesktopEl = document.getElementById("products-menu-desktop");
        if (productsDesktopEl) productsDesktopEl.innerHTML = renderNestedMenu(products);
        bindSubmenuToggles();
        productsMenuRendered = true;
      }

      async function renderServicesMenuIfNeeded() {
        if (servicesMenuRendered) return;
        const services = await ensureServicesLoaded();
        const servicesDesktopEl = document.getElementById("services-menu-desktop");
        if (servicesDesktopEl) servicesDesktopEl.innerHTML = renderNestedMenu(services);
        bindSubmenuToggles();
        servicesMenuRendered = true;
      }

      function normalizePath(value) {
        if (!value) return "";
        if (/^https?:\/\//i.test(value)) return value;
        return value.startsWith("/") ? value : `/${value}`;
      }

      function toCleanPath(path, fallbackPath = "/") {
        if (!path || /^https?:\/\//i.test(path)) return path || fallbackPath;
        const normalized = normalizePath(path);
        if (normalized === "/") return fallbackPath;
        return normalized;
      }

      async function loadPageFromApi(pathOrSlug) {
        try {
          const pages = await getPagesCache();
          if (!Array.isArray(pages) || pages.length === 0) return null;

          const normalized = String(pathOrSlug || "")
            .replace(/^\/+/, "")
            .toLowerCase();

          const page = pages.find((item) => {
            const fullPath = String(item?.full_path || item?.fullPath || "").replace(/^\/+/, "").toLowerCase();
            const slug = String(item?.slug || "").replace(/^\/+/, "").toLowerCase();
            if (normalized === "home" || normalized === "") {
              return fullPath === "" || fullPath === "home" || slug === "home" || slug === "";
            }
            return fullPath === normalized || slug === normalized;
          });
          return page || null;
        } catch (error) {
          console.warn("Unable to load page content from API", error);
          return null;
        }
      }

      function renderPageContent(page) {
        const titleEl = document.getElementById("content-title");
        const bodyEl = document.getElementById("content-body");
        if (!titleEl || !bodyEl || !page) return;

        const title = page.title || page.name || "Page";
        const content = page.content || page.body || "";

        titleEl.textContent = title;
        bodyEl.innerHTML = content.trim()
          ? content
          : "<p class=\"text-slate-600\">No content available for this page.</p>";
      }

      function renderContactForm(form) {
        if (!form || !Array.isArray(form.fields)) return "";

        const fieldsHtml = form.fields
          .map((field) => {
            const fieldName = String(field.name || "").trim();
            const label = field.label || fieldName;
            const requiredMark = field.required ? '<span class="text-red-600">*</span>' : "";
            const requiredAttr = field.required ? "required" : "";
            const placeholder = field.placeholder || "";
            const type = String(field.type || "text").toLowerCase();

            if (!fieldName) return "";

            if (type === "textarea") {
              return `
                <div class="space-y-1">
                  <label class="block text-sm font-medium text-slate-700">${label} ${requiredMark}</label>
                  <textarea name="${fieldName}" ${requiredAttr} placeholder="${placeholder}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:ring-blue-600"></textarea>
                </div>
              `;
            }

            if (type === "select") {
              const options = Array.isArray(field.options) ? field.options : [];
              return `
                <div class="space-y-1">
                  <label class="block text-sm font-medium text-slate-700">${label} ${requiredMark}</label>
                  <select name="${fieldName}" ${requiredAttr} class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:ring-blue-600">
                    <option value="">Select...</option>
                    ${options.map((opt) => `<option value="${opt}">${opt}</option>`).join("")}
                  </select>
                </div>
              `;
            }

            if (type === "checkbox") {
              return `
                <label class="inline-flex items-center gap-2 text-sm text-slate-700">
                  <input type="checkbox" name="${fieldName}" class="rounded border-slate-300 text-blue-600 focus:ring-blue-600" />
                  <span>${label} ${requiredMark}</span>
                </label>
              `;
            }

            if (type === "radio" && Array.isArray(field.options)) {
              return `
                <div class="space-y-2">
                  <p class="block text-sm font-medium text-slate-700">${label} ${requiredMark}</p>
                  <div class="space-y-1">
                    ${field.options
                      .map(
                        (opt) => `
                          <label class="inline-flex items-center gap-2 text-sm text-slate-700 mr-4">
                            <input type="radio" name="${fieldName}" value="${opt}" ${requiredAttr} class="border-slate-300 text-blue-600 focus:ring-blue-600" />
                            <span>${opt}</span>
                          </label>
                        `
                      )
                      .join("")}
                  </div>
                </div>
              `;
            }

            const safeType = ["text", "email", "tel", "number", "url"].includes(type) ? type : "text";
            return `
              <div class="space-y-1">
                <label class="block text-sm font-medium text-slate-700">${label} ${requiredMark}</label>
                <input type="${safeType}" name="${fieldName}" ${requiredAttr} placeholder="${placeholder}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:ring-blue-600" />
              </div>
            `;
          })
          .join("");

        return `
          <section class="mt-6 rounded-xl border border-slate-200 p-4 bg-slate-50">
            <h2 class="text-lg font-semibold text-slate-800">${form.name || "Contact Form"}</h2>
            ${form.description ? `<p class="mt-1 text-sm text-slate-600">${form.description}</p>` : ""}
            <form id="contact-form-dynamic" data-form-id="${form.id}" data-thank-you="${form.thankYouMessage || "Thanks. Your message has been submitted."}" class="mt-4 space-y-4">
              ${fieldsHtml}
              <button type="submit" class="inline-flex items-center rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
                Submit
              </button>
              <p id="contact-form-message" class="text-sm"></p>
            </form>
          </section>
        `;
      }

      async function fetchContactFormForRoute(routeKey) {
        try {
          const payload = await fetchTenantScoped(CONTACT_FORMS_ENDPOINT);
          const forms = Array.isArray(payload) ? payload : payload.data;
          if (!Array.isArray(forms) || !forms.length) return null;
          const normalized = String(routeKey || "").toLowerCase();
          const matched =
            forms.find((f) => String(f.slug || "").toLowerCase() === normalized) ||
            forms.find((f) => String(f.slug || "").toLowerCase().includes(normalized)) ||
            forms[0];
          return matched || null;
        } catch (error) {
          console.warn("Unable to fetch public contact forms", error);
          return null;
        }
      }

      function bindContactFormSubmission() {
        const formEl = document.getElementById("contact-form-dynamic");
        const messageEl = document.getElementById("contact-form-message");
        if (!formEl || !messageEl) return;

        formEl.addEventListener("submit", async (event) => {
          event.preventDefault();
          const formId = formEl.getAttribute("data-form-id");
          const thankYouMessage = formEl.getAttribute("data-thank-you") || "Thanks. Your message has been submitted.";
          if (!formId) return;

          const data = {};
          const elements = Array.from(formEl.elements);
          elements.forEach((el) => {
            if (!el.name) return;
            if (el.type === "checkbox") {
              data[el.name] = Boolean(el.checked);
            } else if (el.type === "radio") {
              if (el.checked) data[el.name] = el.value;
            } else if (el.tagName === "BUTTON") {
              return;
            } else {
              data[el.name] = el.value;
            }
          });

          try {
            const params = getTenantQueryParams();
            const response = await fetch(
              `${API_BASE_URL}${CONTACT_FORMS_ENDPOINT}/${formId}/submissions?${params.toString()}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data })
              }
            );
            if (!response.ok) throw new Error("Submission failed");

            messageEl.textContent = thankYouMessage;
            messageEl.className = "text-sm text-green-700";
            formEl.reset();
          } catch (error) {
            messageEl.textContent = "Unable to submit right now. Please try again.";
            messageEl.className = "text-sm text-red-700";
          }
        });
      }

      function closeAllMenus() {
        const ids = ["products-dropdown", "services-dropdown"];
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el && !el.classList.contains("hidden")) {
            el.classList.add("hidden");
          }
        });
        document.querySelectorAll('[id^="submenu-"]').forEach((el) => {
          el.classList.add("hidden");
        });
      }

      function flattenTreeItems(items, acc = []) {
        items.forEach((item) => {
          acc.push(item);
          if (item.children && item.children.length) flattenTreeItems(item.children, acc);
        });
        return acc;
      }

      function renderCollectionCards(title, items, basePath) {
        if (!Array.isArray(items) || !items.length) {
          return `<p class="text-slate-600">No ${title.toLowerCase()} available.</p>`;
        }

        if (basePath === "/products") {
          return `
            <div class="mt-6 border border-slate-200 rounded-xl overflow-hidden">
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                ${items
                  .map(
                    (item, index) => `
                      <a
                        href="${basePath}/${item.slug || ""}"
                        class="group block p-5 bg-white hover:bg-slate-50 transition border-slate-200
                          ${index % 3 !== 2 ? "lg:border-r" : ""}
                          ${index % 2 !== 1 ? "sm:border-r lg:border-r" : "lg:border-r-0"}
                          ${index >= (items.length - (items.length % 3 || 3)) ? "" : "lg:border-b"}
                          ${index < items.length - 2 ? "sm:border-b" : ""}"
                      >
                        <div class="aspect-[4/3] w-full rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 text-xs">
                          Product
                        </div>
                        <h3 class="mt-4 text-base font-semibold text-slate-800 group-hover:text-blue-700">
                          ${item.name}
                        </h3>
                        <p class="mt-1 text-sm text-slate-600 line-clamp-3">

                        </p>
                      </a>
                    `

                  .join("")}
              </div>
            </div>
          `;
        }

        return `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            ${items
              .map(
                (item) => `
                  <a href="${basePath}/${item.slug || ""}" class="block border border-slate-200 rounded-lg p-4 hover:bg-slate-50">
                    <h3 class="text-lg font-semibold text-slate-800">${item.name}</h3>
                    <p class="mt-1 text-sm text-slate-600">${item.description || "No description available."}</p>
                  </a>
                `
              )
              .join("")}
          </div>

      }

      function renderItemDetail(item, basePath, childLabel) {
        const children = Array.isArray(item.children) ? item.children : [];
        return `
          <article class="space-y-4">
            <div class="text-slate-700">${item.content || item.description || "No content available."}</div>
            ${
              children.length
                ? `
                  <section>
                    <h3 class="text-lg font-semibold text-slate-800">${childLabel}</h3>
                    <ul class="mt-2 space-y-2">
                      ${children
                        .map(
                          (child) => `
                            <li>
                              <a href="${basePath}/${child.slug || ""}" class="text-blue-700 hover:underline">${child.name}</a>
                            </li>
                          `
                        )
                        .join("")}
                    </ul>
                  </section>
                `
                : ""
            }
          </article>
        `;
      }

      function getProductDescription(product, maxWords) {
        if (product.shortDescription && product.shortDescription.trim()) {
          const words = product.shortDescription.trim().split(/\s+/);
          return words.length > maxWords ? words.slice(0, maxWords).join(" ") + "…" : product.shortDescription.trim();
        }
        const html = product.descriptionHtml || product.description || "";
        const text = html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
        if (!text) return null;
        const words = text.split(/\s+/).filter(Boolean);
        return words.length > maxWords ? words.slice(0, maxWords).join(" ") + "…" : text;
      }

      function renderProductDetail(product) {
        const fullHtml = product.descriptionHtml || "";
        const imgs = (product.images || [])
          .filter((pi) => pi && pi.image)
          .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0))
          .map((pi) => pi.image.mediumUrl || pi.image.largeUrl || pi.image.spacesUrl || pi.image.thumbnailUrl)
          .filter(Boolean);
        const mainImg = product.previewImageUrl || product.previewThumbnailUrl || imgs[0];
        const allImgs = mainImg && !imgs.includes(mainImg) ? [mainImg, ...imgs] : imgs.length ? imgs : mainImg ? [mainImg] : [];
        const alts = (product.images || []).filter((pi) => pi && pi.image).sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0)).map((pi) => (pi.altText || pi.image?.altText || product.name || "").replace(/"/g, "&quot;"));
        const alt = (product.previewAltText || product.name || "").replace(/"/g, "&quot;");

        const colCount = 4;
        const cols = Array.from({ length: colCount }, () => []);
        allImgs.forEach((url, i) => cols[i % colCount].push({ url, alt: alts[i] || alt }));

        const masonryGallery = allImgs.length
          ? `
            <div class="grid grid-cols-2 gap-4 md:grid-cols-4" id="product-gallery">
              ${cols.map((colImgs) => `
                <div class="grid gap-4">
                  ${colImgs.map((item) => `
                    <button type="button" class="product-gallery-img block w-full rounded-lg overflow-hidden bg-slate-100 text-left cursor-pointer hover:opacity-90 transition-opacity" data-src="${item.url.replace(/"/g, "&quot;")}">
                      <img src="${item.url}" alt="${item.alt}" class="h-auto w-full max-w-full object-cover object-center" loading="lazy" />
                    </button>
                  `).join("")}
                </div>
              `).join("")}
            </div>
            <div id="product-gallery-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 cursor-pointer hidden" tabindex="-1" data-gallery-backdrop>
              <button type="button" class="product-gallery-close absolute top-4 right-4 z-10 w-10 h-10 flex items-center justify-center rounded-full bg-white/20 text-white hover:bg-white/30 cursor-pointer" aria-label="Close">✕</button>
              <div class="cursor-default" onclick="event.stopPropagation()"><img id="product-gallery-modal-img" src="" alt="" class="max-h-[90vh] max-w-full rounded-lg object-contain" /></div>
            </div>
          `
          : "";

        return `
          <p class="mb-4"><a href="/products" class="text-blue-600 hover:underline">← Back to Products</a></p>
          <div class="mt-6 grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12">
            <div class="order-2 lg:order-1">${masonryGallery}</div>
            <div class="order-1 lg:order-2">
              <h2 class="text-2xl font-bold text-slate-800">${product.name || "Untitled Product"}</h2>
              ${product.shortDescription ? `<p class="mt-3 text-slate-600">${product.shortDescription}</p>` : ""}
              ${fullHtml ? `<div class="mt-6 prose prose-slate max-w-none">${fullHtml}</div>` : ""}
            </div>
          </div>
        `;
      }

      function renderProductCard(product) {
        const description = getProductDescription(product, 25);
        const imgUrl = product.previewThumbnailUrl || product.previewImageUrl ||
          (product.images && product.images[0] && (product.images[0].image?.thumbnailUrl || product.images[0].image?.mediumUrl || product.images[0].image?.spacesUrl));
        const productUrl = product.slug ? `/products/p/${product.slug}` : null;
        const cardContent = `
          ${imgUrl ? `<div class="aspect-square overflow-hidden rounded-t-lg bg-slate-100"><img src="${imgUrl}" alt="${(product.previewAltText || product.name || "").replace(/"/g, "&quot;")}" class="w-full h-full object-cover" loading="lazy" /></div>` : ""}
          <div class="p-4">
            <h4 class="text-base font-semibold text-slate-800">${product.name || "Untitled Product"}</h4>
            ${description ? `<p class="mt-1 text-sm text-slate-600">${description}</p>` : ""}
          </div>
        `;
        return `<article class="border border-slate-200 rounded-lg bg-white overflow-hidden">${productUrl ? `<a href="${productUrl}" class="block">${cardContent}</a>` : cardContent}</article>`;
      }

      function renderProductItemsGrid(products, total, category, nextOffset) {
        if (!Array.isArray(products)) products = [];
        const hasMore = total > products.length;
        const countText = total > 0 ? `Showing ${products.length} of ${total} products` : "No products found in this category.";

        return `
          <section class="mt-6" id="products-section">
            <h3 class="text-lg font-semibold text-slate-800">Products</h3>
            <p class="mt-1 text-sm text-slate-600" id="products-count">${countText}</p>
            <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="products-grid">
              ${products.map((p) => renderProductCard(p)).join("")}
            </div>
            ${hasMore ? `
              <div class="mt-4" id="products-load-more-wrap">
                <button
                  type="button"
                  data-products-load-more
                  data-category-slug="${(category?.slug || "").replace(/"/g, "&quot;")}"
                  data-category-id="${(category?.id || "").replace(/"/g, "&quot;")}"
                  data-next-offset="${nextOffset}"
                  data-total="${total}"
                  class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50"
                >
                  Load more
                </button>
              </div>
            ` : ""}
          </section>
        `;
      }

      async function hydrateProductsRoute(segments) {
        await ensureProductsLoaded();
        const titleEl = document.getElementById("content-title");
        const bodyEl = document.getElementById("content-body");
        if (!titleEl || !bodyEl) return;

        titleEl.textContent = "Products";

        // Product detail: /products/p/product-slug
        if (segments[0] === "p" && segments[1]) {
          const productSlug = segments[1];
          try {
            const product = await fetchProductBySlug(productSlug);
            titleEl.textContent = product.name || "Product";
            bodyEl.innerHTML = renderProductDetail(product);
          } catch {
            titleEl.textContent = "Product not found";
            bodyEl.innerHTML = `<p class="text-slate-600 mt-4">This product could not be found.</p>`;
          }
          return;
        }

        if (!segments.length) {
          bodyEl.innerHTML = renderCollectionCards("Products", productsCatalogCache, "/products");
          return;
        }

        // Use last segment for nested paths: /products/top-props/events -> match "events"
        const slug = (segments[segments.length - 1] || segments[0] || "").toLowerCase();
        const allItems = flattenTreeItems(productsCatalogCache);
        const matched = allItems.find((item) => String(item.slug || "").toLowerCase() === slug);
        if (!matched) {
          bodyEl.innerHTML = `<p class="text-slate-600">Product category not found.</p>`;
          return;
        }

        titleEl.textContent = matched.name || "Products";
        let productsMarkup = "";
        try {
          const { items: productItems, total } = await fetchProductsForCategory(matched);
          const nextOffset = productItems.length;
          productsMarkup = renderProductItemsGrid(productItems, total, matched, nextOffset);
        } catch (error) {
          productsMarkup = `<p class="text-slate-500 mt-4">Unable to load products for this category right now.</p>`;
        }

        bodyEl.innerHTML = `${renderItemDetail(matched, "/products", "Subcategories")}${productsMarkup}`;
        bindProductsLoadMore();
      }

      async function hydrateServicesRoute(segments) {
        await ensureServicesLoaded();
        const titleEl = document.getElementById("content-title");
        const bodyEl = document.getElementById("content-body");
        if (!titleEl || !bodyEl) return;

        titleEl.textContent = "Services";
        if (!segments.length) {
          bodyEl.innerHTML = renderCollectionCards("Services", servicesCatalogCache, "/services");
          return;
        }

        const slug = segments[0].toLowerCase();
        const allItems = flattenTreeItems(servicesCatalogCache);
        const matched = allItems.find((item) => String(item.slug || "").toLowerCase() === slug);
        if (!matched) {
          bodyEl.innerHTML = `<p class="text-slate-600">Service not found.</p>`;
          return;
        }

        titleEl.textContent = matched.name || "Services";
        bodyEl.innerHTML = renderItemDetail(matched, "/services", "Related services");
      }

      async function hydratePageFromPathname(pathname = window.location.pathname) {
        const normalized = String(pathname || "/").replace(/^\/+|\/+$/g, "").toLowerCase();
        const segments = normalized ? normalized.split("/") : [];
        const pageKey = segments[0] || "home";

        if (pageKey === "products") {
          await hydrateProductsRoute(segments.slice(1));
          return;
        }

        if (pageKey === "services") {
          await hydrateServicesRoute(segments.slice(1));
          return;
        }

        const page = await loadPageFromApi(pageKey);
        if (page) {
          renderPageContent(page);
        } else {
          const titleEl = document.getElementById("content-title");
          const bodyEl = document.getElementById("content-body");
          if (titleEl) titleEl.textContent = pageKey.charAt(0).toUpperCase() + pageKey.slice(1);
          if (bodyEl) bodyEl.innerHTML = "";
        }

        if (pageKey === "contact") {
          const form = await fetchContactFormForRoute("contact");
          if (form) {
            const bodyEl = document.getElementById("content-body");
            if (bodyEl) {
              bodyEl.innerHTML = `${bodyEl.innerHTML}${renderContactForm(form)}`;
              bindContactFormSubmission();
            }
          }
        }
      }

      function bindCmsPageNavigation() {
        if (cmsNavigationBound) return;
        cmsNavigationBound = true;

        document.addEventListener("click", async (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const galleryImg = target.closest(".product-gallery-img");
          if (galleryImg) {
            const src = galleryImg.getAttribute("data-src");
            const modal = document.getElementById("product-gallery-modal");
            const modalImg = document.getElementById("product-gallery-modal-img");
            if (src && modal && modalImg) {
              modalImg.src = src;
              modalImg.alt = galleryImg.querySelector("img")?.alt || "";
              modal.classList.remove("hidden");
              document.body.style.overflow = "hidden";
            }
            return;
          }
          const galleryClose = target.closest(".product-gallery-close");
          const galleryBackdrop = target.closest("[data-gallery-backdrop]");
          if (galleryClose || (galleryBackdrop && target === galleryBackdrop)) {
            const modal = document.getElementById("product-gallery-modal");
            if (modal) {
              modal.classList.add("hidden");
              document.body.style.overflow = "";
            }
            return;
          }
          const link = target.closest("a");
          if (!link) return;

          const href = link.getAttribute("href") || "";
          if (!href.startsWith("/") || href.startsWith("//")) return;
          if (link.hasAttribute("download") || link.getAttribute("target") === "_blank") return;

          event.preventDefault();
          closeAllMenus();
          history.pushState({}, "", href);
          await hydratePageFromPathname(href);
        });

        window.addEventListener("popstate", async () => {
          await hydratePageFromPathname(window.location.pathname);
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            const modal = document.getElementById("product-gallery-modal");
            if (modal && !modal.classList.contains("hidden")) {
              modal.classList.add("hidden");
              document.body.style.overflow = "";
            }
          }
        });
      }

      function flattenForSearch(items, sectionName, acc = []) {
        items.forEach((item) => {
          acc.push({ label: item.name, url: item.url || (item.slug ? `/${item.slug}` : ""), section: sectionName });
          if (item.children && item.children.length) flattenForSearch(item.children, sectionName, acc);
        });
        return acc;
      }

      const SEARCH_SECTION_ORDER = ["Products", "Services", "Pages", "Blogs", "Main"];

      function renderSearchResults(targetEl, results, query) {
        if (!results.length) {
          targetEl.classList.add("hidden");
          targetEl.innerHTML = "";
          targetEl.previousElementSibling?.setAttribute?.("aria-expanded", "false");
          return;
        }
        const bySection = {};
        results.forEach((item) => {
          if (!bySection[item.section]) bySection[item.section] = [];
          bySection[item.section].push(item);
        });
        targetEl.innerHTML = SEARCH_SECTION_ORDER.filter((s) => bySection[s]?.length)
          .map((section) => {
            const items = bySection[section].slice(0, section === "Products" ? 12 : 6);
            return `
              <div class="py-2">
                <div class="px-3 py-1 text-xs font-medium text-slate-500 uppercase tracking-wider">${section}</div>
                ${items
                  .map(
                    (item) => `
                  <a href="${item.url}" class="flex items-center gap-x-3 py-2 px-3 rounded-lg hover:bg-slate-100 focus:outline-none focus:bg-slate-100">
                    <span class="text-sm text-slate-800">${item.label}</span>
                    <span class="ml-auto text-xs text-slate-500">${item.section}</span>
                  </a>
                `
                  )
                  .join("")}
              </div>
            `;
          })
          .join("");
        targetEl.classList.remove("hidden");
        targetEl.previousElementSibling?.setAttribute?.("aria-expanded", "true");
      }

      function hideSearchResults(resultsEl) {
        resultsEl.classList.add("hidden");
        const inputId = resultsEl.id === "search-results-mobile" ? "menu-search-mobile" : "menu-search";
        const input = document.getElementById(inputId);
        if (input) input.setAttribute("aria-expanded", "false");
      }

      function bindSearch(inputId, resultsId, getAllItems) {
        const inputEl = document.getElementById(inputId);
        const resultsEl = document.getElementById(resultsId);
        if (!inputEl || !resultsEl) return;

        const search = () => {
          const query = inputEl.value.trim().toLowerCase();
          const allItems = getAllItems();
          if (!query) {
            renderSearchResults(resultsEl, [], query);
            return;
          }
          const filtered = allItems.filter(
            (item) =>
              (item.label || "").toLowerCase().includes(query) ||
              (item.url || "").toLowerCase().includes(query) ||
              (item.section || "").toLowerCase().includes(query)
          );
          renderSearchResults(resultsEl, filtered, query);
        };

        inputEl.addEventListener("input", search);
        inputEl.addEventListener("focus", () => {
          if (inputEl.value.trim()) search();
        });

        document.addEventListener("click", (event) => {
          if (!resultsEl.contains(event.target) && event.target !== inputEl) hideSearchResults(resultsEl);
        });
      }

      let searchIndexCache = [];

      async function buildSearchIndex() {
        const homeHref = "/";
        const aboutHref = "/about";
        const contactHref = "/contact";
        const items = [
          { label: "Home", url: homeHref, section: "Main" },
          { label: "About", url: aboutHref, section: "Main" },
          { label: "Contact", url: contactHref, section: "Main" }
        ];

        try {
          const pages = await getPagesCache();
          (pages || []).forEach((p) => {
            const path = (p.full_path || p.fullPath || p.slug || "").replace(/^\/+/, "") || "home";
            items.push({ label: p.title || p.name || path, url: path ? `/${path}` : "/", section: "Pages" });
          });
        } catch (_) {}

        try {
          await ensureProductsLoaded();
          flattenForSearch(productsCatalogCache, "Products", items);
          const params = getTenantQueryParams();
          const prodRes = await fetch(`${API_BASE_URL}${PRODUCTS_LIST_ENDPOINT}?${params.toString()}&limit=100`);
          if (prodRes.ok) {
            const data = await prodRes.json();
            const prods = data?.items || [];
            prods.forEach((p) => items.push({ label: p.name, url: p.slug ? `/products/p/${p.slug}` : `/products`, section: "Products" }));
          }
        } catch (_) {}

        try {
          await ensureServicesLoaded();
          flattenForSearch(servicesCatalogCache, "Services", items);
        } catch (_) {}

        try {
          const params = getTenantQueryParams();
          const blogRes = await fetch(`${API_BASE_URL}${BLOGS_ENDPOINT}?${params.toString()}&limit=50`);
          if (blogRes.ok) {
            const data = await blogRes.json();
            const posts = data?.items || data || [];
            posts.forEach((p) => items.push({ label: p.title || p.name, url: p.slug ? `/blog/${p.slug}` : "#", section: "Blogs" }));
          }
        } catch (_) {}

        searchIndexCache = items;
        return items;
      }

      async function initNavbarMenus() {
        const homeHref = "/";
        const aboutLinkEl = document.getElementById("about-link");
        const homeLinkEl = document.getElementById("home-link");
        const contactLinkEl = document.getElementById("contact-link");
        const aboutHref = "/about";
        const contactHref = "/contact";

        if (homeLinkEl) homeLinkEl.setAttribute("href", homeHref);
        if (aboutLinkEl) aboutLinkEl.setAttribute("href", aboutHref);
        if (contactLinkEl) contactLinkEl.setAttribute("href", contactHref);
        bindCmsPageNavigation();

        const productsDropdownButton = document.getElementById("products-dropdown-button");
        const servicesDropdownButton = document.getElementById("services-dropdown-button");
        if (productsDropdownButton) {
          productsDropdownButton.addEventListener("click", () => void renderProductsMenuIfNeeded());
        }
        if (servicesDropdownButton) {
          servicesDropdownButton.addEventListener("click", () => void renderServicesMenuIfNeeded());
        }

        bindSearch("menu-search", "search-results", () => searchIndexCache);
        bindSearch("menu-search-mobile", "search-results-mobile", () => searchIndexCache);

        void buildSearchIndex();
        await hydratePageFromPathname(window.location.pathname);
      }

      initNavbarMenus();
    </script>
